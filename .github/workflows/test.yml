name: Tests

on:
  # Branches only: a version tag belongs to release.yml, and a second run on the
  # tag ref would only warm a cache nothing else uses.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new commit on the same branch cancels the run it superseded.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # vite 8 needs ^20.19 || >=22.12; "22" resolves to the latest 22.x LTS.
      # `cache: npm` restores ~/.npm, keyed on package-lock.json.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # `files` + `exports` decide what actually ships, and the dts step has
      # written `dist/dist.d.ts` before — check the tarball, not just the build.
      - name: Build and check the package
        run: |
          npm run build
          test -f dist/index.d.ts
          npm pack --dry-run

      # Budget is a gate, not a report: the library is sold as ~3.9 kB.
      - name: Check the gzip budget
        run: |
          size=$(gzip -c dist/ce-autoloader.js | wc -c | tr -d ' ')
          echo "ce-autoloader.js: ${size} B gzipped (budget 4096 B)"
          test "$size" -le 4096

      # Browsers live outside node_modules, so they need their own cache. The
      # lockfile hash is the exact key: keying on package.json would let a newer
      # Playwright 1.x resolve against the browser build already in the cache.
      # No restore-keys on purpose — a stale browser is worse than a re-download.
      - name: Restore Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # WebKit and Firefox need shared libraries that the runner does not ship,
      # hence --with-deps. Keep the browser list in sync with DEFAULT_BROWSERS
      # in scripts/run-integration-tests.js. Already-downloaded browsers are
      # skipped, so this is cheap on a cache hit.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run npm run test
        run: npm run test
        env:
          # A browser that fails to launch is reported as "skipped" and does not
          # fail the run, so CI turns that case into a failure.
          TEST_STRICT: "1"
