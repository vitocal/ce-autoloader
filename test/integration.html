<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CEAutoLoader Integration Tests</title>
    <link rel="stylesheet" href="https://unpkg.com/mocha/mocha.css" />
    <style>
        :root {
            --color-primary: #e31;
            --color-secondary: rgb(0 172 172 / 34%);
            --color-accent: #333;
            --color-bg-dark: #ddd;
            --color-bg: #eee;
            --color-bg-light: #fff;
            --color-fg: #333;
        }

        #fixtures {
            display: grid;
            width: auto;
            height: 320px;
            align-content: center;
            gap: 8px;
            justify-items: center;
            justify-content: center;
            margin: 50px;
            border: 1px solid gray;
        }

        #errors {
            color: red;
            background: #fee;
            padding: 1em;
            white-space: pre;
            font-family: monospace;
            width: 80%;
            margin: 0 auto;

            &:empty {
                display: none;
            }
        }

        :not(:defined) {
            display: block;
            border: 1px dashed var(--color-accent);
            background-color: var(--color-secondary);
            color: var(--color-fg);
            opacity: 0.8;
            width: auto;
            min-height: 1em;
            padding: 1em 0.5em;
            border-radius: 0.33em;
        }
    </style>
</head>

<body>
    <!-- #fixtures comes first so it stays in the viewport: the mocha report grows
         as the suite runs, and the `visible` directive needs real visibility. -->
    <div id="fixtures"></div>
    <div id="mocha"></div>
    <div id="errors"></div>

    <script src="https://unpkg.com/mocha/mocha.js"></script>

    <script>
        window.onerror = function (msg, url, line, col, error) {
            document.getElementById('errors').textContent += `Error: ${msg}\nAt: ${url}:${line}:${col}\nStack: ${error?.stack}\n\n`;
        };
        window.addEventListener('unhandledrejection', function (event) {
            document.getElementById('errors').textContent += `Unhandled Rejection: ${event.reason}\n\n`;
        });
    </script>

    <script class="mocha-init">
        mocha.setup('bdd');
    </script>

    <script>
        // Safari has never enabled `requestIdleCallback` by default — caniuse
        // reports it "disabled by default" through Safari 27.x (TP only) — and
        // the suites await it directly. The loader itself only needs it on the
        // `deferDefine: true` path (`src/index.ts`), so a shim is enough to run
        // the same suites on WebKit. Chromium and Firefox keep the native one.
        if (!window.requestIdleCallback) {
            window.requestIdleCallback = (callback, options) => setTimeout(
                () => callback({ didTimeout: false, timeRemaining: () => 0 }),
                Math.min(options?.timeout ?? 0, 50) || 1,
            );
            window.cancelIdleCallback = (handle) => clearTimeout(handle);
        }
    </script>

    <!-- Test suites -->
    <script type="module">import "shadow-observer";</script>
    <script type="module" src="./integration.test.js"></script>
    <script type="module" src="./observability.test.js"></script>
    <script type="module" src="./transitions.test.js"></script>
    <script type="module" src="./shadow.test.js"></script>
    <script type="module" src="./importmap.test.js"></script>

    <!-- Run mocha once every suite has been registered -->
    <script type="module">
        const runner = mocha.run();
        runner.on('end', () => {
            window.__MOCHA_DONE__ = true;
            window.__MOCHA_STATS__ = runner.stats;
        });
    </script>

</body>

</html>
