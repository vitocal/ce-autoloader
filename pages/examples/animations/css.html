<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animating the lifecycle with CSS — ce-autoloader</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Page chrome. The demo state styles live in the blocks below, one per documented section. -->
  <style>
    body {
      display: flex;
      flex-direction: column;
      gap: 2em;
      padding: 2em clamp(1em, 5vw, 4em) 6em;
      overflow-x: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    :root {
      interpolate-size: allow-keywords;
      --duration: 2s;
    }

    h1,
    h2,
    h3 {
      margin-bottom: 0.25em;
      font-size: revert;
      font-weight: revert;
    }

    p,
    li,
    table {
      max-width: 72ch;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9em;
    }

    pre {
      max-width: 100%;
      overflow-x: auto;
      padding: 0.75em 1em;
      background: #0000000a;
      border-radius: 0.5em;
    }

    table {
      border-collapse: collapse;
    }

    th,
    td {
      text-align: left;
      padding: 0.35em 0.75em 0.35em 0;
      vertical-align: top;
    }

    .demo {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1em;
      min-height: 3em;

      &>*:only-child {
        flex: 1 1 auto;
      }
    }
  </style>

  <!-- 1. Default CSS selectors -->
  <style>
    /* 1. Unregistered state */
    :not(:defined) {
      opacity: 0.2;
      filter: blur(2px);
      transition: opacity var(--duration) ease;
    }

    /* 2. Loading state (module is fetching) */
    [ce="loading"] {
      position: relative;
      overflow: hidden;
      filter: none;
      opacity: 0.75;
    }

    /* Skeleton Shimmer */
    [ce="loading"]::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(0, 0, 0, 0.2), transparent);
      animation: shimmer 1.5s infinite;
    }

    [ce="error"] {
      outline: 1px solid red;
      color: red;
    }

    @keyframes shimmer {
      100% {
        transform: translateX(100%);
      }
    }
  </style>

  <!-- 2. Use CSS transitions to animate state changes -->
  <style>
    .ce {
      transition: all 1s ease-out;
      opacity: .25;
    }

    .ce[ce="loading"] {
      opacity: 0.75;
    }

    .ce[ce="defined"] {
      opacity: 1;
    }
  </style>

  <!-- 3. Use CSS animations for the last defined state -->
  <style>
    .ce[ce="defined"] {
      animation: pop-in 1.5s ease-out;
      height: calc-size(auto, size);
    }

    @keyframes pop-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }
  </style>

  <!-- 4. Other examples -->
  <style>
    .grid {
      display: grid;
      gap: 1.5rem;
    }

    .card {
      border: 1px solid #334155;
      padding: 1.25rem;
      border-radius: 12px;
    }

    /* SHOWCASE 1: Pop In (Bouncy Overshoot) */
    demo-pop {
      display: block;
      padding: 1rem;
      background: #3b82f6;
      border-radius: 8px;
    }

    demo-pop[ce="defined"] {
      animation: pop-in var(--duration) cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes pop-in {
      from {
        opacity: 0;
        transform: scale(0.85);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* SHOWCASE 2: Smooth Height Expand & Fade */
    demo-expand {
      padding: 1rem;
      background: #10b981;
      border-radius: 8px;
      transition: height var(--duration) ease-in-out;
      overflow: hidden;
      height: calc(1lh + 2rem);
    }

    demo-expand[ce="defined"] {
      height: calc-size(auto, size);
      animation: expand-fade var(--duration) ease-in-out forwards;
    }

    @keyframes expand-fade {
      from {
        opacity: 0.75;
      }

      to {
        opacity: 1;
      }
    }

    /* SHOWCASE 3: 3D Flip Entrance */
    demo-flip {
      display: block;
      padding: 1rem;
      background: #8b5cf6;
      border-radius: 8px;
      perspective: 600px;
    }

    demo-flip[ce="defined"] {
      animation: flip-3d var(--duration) cubic-bezier(0.23, 1, 0.32, 1) forwards;
    }

    @keyframes flip-3d {
      from {
        opacity: 0;
        transform: rotateX(-70deg);
      }

      to {
        opacity: 1;
        transform: rotateX(0deg);
      }
    }

    /* SHOWCASE 4: Reveal Clip-Mask Sweep */
    demo-reveal {
      display: block;
      padding: 1rem;
      background: #ec4899;
      border-radius: 8px;
    }

    demo-reveal[ce="defined"] {
      animation: reveal-sweep var(--duration) cubic-bezier(0.77, 0, 0.175, 1) forwards;
    }

    @keyframes reveal-sweep {
      from {
        opacity: 0;
        clip-path: inset(0 100% 0 0);
      }

      to {
        opacity: 1;
        clip-path: inset(0 0 0 0);
      }
    }

    /* SHOWCASE 5: Cascading Staggered Items */
    demo-stagger-container {
      display: flex;
      gap: 0.75rem;
    }

    demo-stagger-item {
      flex: 1;
      padding: 1rem;
      background: #f59e0b;
      border-radius: 8px;
      display: block;
    }

    demo-stagger-item[ce="defined"] {
      opacity: 0;
      animation: slide-up var(--duration) cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    demo-stagger-item:nth-child(1)[ce="defined"] {
      animation-delay: 0.05s;
    }

    demo-stagger-item:nth-child(2)[ce="defined"] {
      animation-delay: 0.15s;
    }

    demo-stagger-item:nth-child(3)[ce="defined"] {
      animation-delay: 0.25s;
    }

    @keyframes slide-up {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>

  <script>
    window.DEFAULT_CE_DELAY = 3000
  </script>
  <script type="module">
    import CERegistry from "/src/index.ts";
    import catalog from "@/components/catalog.js";

    // The page itself is a <zero-md> that renders ./css.md; add it to the catalog.
    catalog["zero-md"] = "https://cdn.jsdelivr.net/npm/zero-md@3?register";

    catalog["nord-badge"] = async () => {
      await new Promise((resolve) => setTimeout(resolve, DEFAULT_CE_DELAY));
      return await import(/* @vite-ignore */ `https://esm.sh/@nordhealth/components/lib/Badge.js`);
    };

    catalog["model-viewer"] = async () => {
      await new Promise((resolve) => setTimeout(resolve, DEFAULT_CE_DELAY));
      return await import(/* @vite-ignore */ `https://esm.sh/@google/model-viewer@latest&standalone`);
    };

    globalThis.registry = new CERegistry({
      catalog,
      transition: false,
      deferDefine: false,
    });
  </script>
</head>

<body>
  <zero-md no-shadow src="./css.md"></zero-md>

  <script>
    /**
     * The demo components are plain classes, not catalog entries, so the lifecycle
     * attributes painted on them (`ce="loading"` / `ce="defined"`) are faked here to
     * show the CSS states without waiting on the network.
     */
    function runLifecycleSimulation() {
      const elements = Array.from(document.querySelectorAll('demo-pop, demo-expand, demo-flip, demo-reveal, demo-stagger-item'));
      if (!elements.length) return;

      // Step 1: Reset to Unregistered / Loading state
      setTimeout(() => {
        elements.forEach(el => el.setAttribute('ce', 'loading'));
      }, 1000);

      // Step 2: Simulate module resolution & customElement definition delay
      setTimeout(() => {
        const tags = ['demo-pop', 'demo-flip', 'demo-reveal', 'demo-stagger-container', 'demo-stagger-item'];
        tags.forEach(tag => {
          if (!customElements.get(tag)) {
            customElements.define(tag, class extends HTMLElement { });
          }
        });

        if (!customElements.get('demo-expand')) {
          customElements.define('demo-expand', class extends HTMLElement {
            connectedCallback() {
              // Set a fixed height to allow smooth transition
              const p = document.createElement('p')
              p.innerText = 'Grows gracefully to reveal multi-line content using calc-size().';
              this.appendChild(p);
            }
          });
        }

        // Step 3: Set state to defined to trigger keyframe entrances
        elements.forEach(el => el.setAttribute('ce', 'defined'));
      }, 3000);
    }

    // <zero-md> fetches ./css.md and renders it *after* this script runs, so wait
    // for the demo elements to land before running the simulation.
    function whenDemosReady(callback) {
      if (document.querySelector('demo-pop')) return callback();

      const timer = setInterval(() => {
        if (document.querySelector('demo-pop')) {
          clearInterval(timer);
          callback();
        }
      }, 100);
    }

    whenDemosReady(runLifecycleSimulation);
  </script>
</body>

</html>
