<!doctype html>
<html lang="en">
  <head>
    <script type="importmap">
      {
        "imports": {
          "lit": "/assets/vendor.js",
          "lit/decorators.js": "/assets/vendor.js",
          "lit/directives/ref.js": "/assets/vendor.js",
          "lit/directives/if-defined.js": "/assets/vendor.js",
          "lit-element": "/assets/vendor.js",
          "lit-html": "/assets/vendor.js",
          "lit/directives/unsafe-html.js": "/assets/vendor.js",
          "lit/directives/style-map.js": "/assets/vendor.js",
          "syntax-highlight": "https://cdn.jsdelivr.net/npm/syntax-highlight-element@1/+esm"
        }
      }
    </script>
    <style>
      @layer normalize, ds, shared, page, components, scoped, hotfix;

      body {
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 1em;
      }

      :not(:defined) {
        min-width: fit-content;
        min-height: 24px;
        display: block;
        visibility: visible;
        outline: 2px dashed teal;
      }

      /* 2. Loading State: maybe a skeleton or a spinner? */
      [ce-loading] {
        display: block;
        position: relative;
        overflow: clip;

        &::after {
          content: "";
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          animation: shimmer 1s ease-out infinite;
          background: linear-gradient(to right, transparent 10%, #0006 50%, transparent 90%);
          background-size: 100% 100%;
        }
      }

      /* 3. Final State: fade in */
      [ce-defined] {
        display: block;
        animation: fade-in 3s ease-out 1;
      }
    </style>

    <script type="module" defer>
      import { loadCSSLayer } from "@/utils.ts";
      import CERegistry from "/src/index.js";
      import catalog from "@/components/catalog.js";

      loadCSSLayer("/shared.css", "ds");
      loadCSSLayer("https://nordcdn.net/ds/css/4.2.0/nord.min.css", "ds");

      const loaders = {
        a: async () => {
          return await import(/* @vite-ignore */ `./a.js`);
        },
        b: async () => {
          return await import(/* @vite-ignore */ `./b.js`);
        },
      };

      function registerComponents(event) {
        const loader = loaders[event.target.getAttribute("loader")];
        if (!loader) {
          throw new Error("Invalid loader");
        }

        catalog["ab-component"] = loader;
        registry.discover();
      }

      document.querySelectorAll("button").forEach((button) => button.addEventListener("click", registerComponents));

      const registry = new CERegistry({
        catalog: catalog,
        defaultDirective: "visible",
        live: true,
        transition: true,
      });
    </script>
  </head>

  <body>
    <button loader="a">register A component</button>
    <button loader="b">register B component</button>
    <ab-component loading="visible">I'm a AB component, not yet defined!</ab-component>
  </body>
</html>
