    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        margin: 0;
        display: flex;
        height: 100vh;
      }
      aside {
        width: 250px;
        border-right: 1px solid #eee;
        overflow: hidden;
      }
      main {
        overflow-x: hidden;
        overflow-y: auto;
        display: grid;
        grid-template-rows: 20% 1fr;
      }
      header {
        padding: 20px;
        border-bottom: 1px solid #eee;
        background: white;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .container {
        display: grid;
        width: 100%;
        height: 100%;

        grid-template-columns: 250px 1fr;
        grid-template-rows: 1fr;
      }

      /* undefined states */
      :not(:defined) {
        display: block;
        height: 100%;
        width: 100%;
      }

      /* Loading states */
      [ce="loading"] {
        opacity: 0.5;
        filter: grayscale(1);

        background-color: #eee;
        --color-bg-dark: #aaa;

        &::after {
          pointer-events: none;
          content: " ";
          position: absolute;
          inset: 0;

          transform: translateX(-100%);
          width: 100%;

          background: linear-gradient(to right, transparent 10%, var(--color-bg-dark) 50%, transparent 90%);
          will-change: transform;
          animation: shimmer 1.5s ease-in-out infinite;
        }
      }
      [ce="defined"] {
        opacity: 1;
        transition: opacity 0.5s ease-in;
      }

      /* Shimmer/skeleton */
      @keyframes shimmer {
        to {
          transform: translateX(100%);
        }
      }

      total-summary {
        position: fixed;
        min-width: 250px;
        min-height: 180px;
        bottom: 20px;
        right: 20px;

        &:not(:defined) {
          opacity: 0;
        }
      }
    </style>
