<!doctype html>
<html lang="en">

<head>
  <style>
    @layer normalize, ds, shared, page, components, scoped, hotfix;

    body {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 1em;
    }

    :not(:defined) {
      min-width: fit-content;
      min-height: 24px;
      display: block;
      visibility: visible;
      outline: 2px dashed teal;
    }

    /* 2. Loading State: maybe a skeleton or a spinner? */
    [ce-loading] {
      display: block;
      position: relative;
      overflow: clip;

      &::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        animation: shimmer 1s ease-out infinite;
        background: linear-gradient(to right, transparent 10%, #0006 50%, transparent 90%);
        background-size: 100% 100%;
      }
    }

    /* 3. Final State: fade in */
    [ce-defined] {
      display: block;
      animation: fade-in 3s ease-out 1;
    }
  </style>

  <script type="module" crossorigin src="/assets/a-b_testing.html-DaVI0tpK.js"></script>
</head>

<body>
  <button loader="a">register A component</button>
  <button loader="b">register B component</button>
  <ab-component loading="visible">I'm a A/B component, not yet defined!</ab-component>
</body>

</html>
