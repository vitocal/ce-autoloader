<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CE-autoloader - View transitions</title>


  <link rel="stylesheet" href="/ce-autoloader/styles.css" />

  <style>body{--duration:1.5s;margin:0}[ce=error]:after{content:attr(error);color:#fff}.preview{place-items:center;width:100%;min-height:600px;display:grid;position:relative;overflow:hidden}.timeline{align-items:center;gap:.5em;height:36px;display:flex;overflow:hidden}.timeline #scrub{width:100%}#big-play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}observable-plot-wrapper{text-align:center;width:100%;height:100%;display:block;overflow:clip}observable-plot-wrapper:not(:defined){text-align:center;width:100%;height:50%;display:block;overflow:clip}::view-transition-group(*){animation-duration:3s;overflow:clip}</style>
  <script async type="module" crossorigin src="/ce-autoloader/assets/view-transition.html-BpKX70Ao.js"></script>
</head>

<body>
  <div class="">
    <div class="preview">
      <observable-plot-wrapper view-transition-name="plot-example" loading="manual">
        🌜 Phases of the Moon 🌛
      </observable-plot-wrapper>
      <nord-button square id="big-play-btn" type="button" variant="primary" size="l">
        <nord-icon name="interface-play"></nord-icon>
      </nord-button>
    </div>
    <div class="timeline">
      <nord-button-group>
        <nord-button square id="play" mode="play" type="button" variant="primary">
          <nord-icon name="interface-play"></nord-icon>
        </nord-button>
        <nord-button square id="reload" type="button">
          <nord-icon name="arrow-refresh"></nord-icon>
        </nord-button>
      </nord-button-group>

      <input id="scrub" type="range" min="0" max="1" step="0.01" value="0" />

      <nord-select size="s" autocomplete="off" hide-label value="1500" id="speed">
        <option value="750">Fast(750ms)</option>
        <option value="1500">Normal(1.5s)</option>
        <option value="5000">Slow(5s)</option>
      </nord-select>
    </div>
  </div>
</body>

</html>
