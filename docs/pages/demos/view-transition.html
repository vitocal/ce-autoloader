    <meta charset="UTF-8" />

    <title>CE-autoloader - View transitions</title>


    <link rel="stylesheet" href="/ce-autoloader/styles.css" />

    <style>
      body {
        margin: 0px;
      }

      [ce="error"] {
        &::after {
          content: attr(error);
          color: white;
        }
      }

      :root {
        view-transition-name: none;
        --duration: 1.5s;
      }

      ::view-transition {
        pointer-events: none;
      }

      .preview {
        width: 100%;
        min-height: 600px;
        overflow: hidden;
        position: relative;

        display: grid;
        place-items: center;
        /* display: flex;
            align-items: center;
            justify-content: center; */
      }

      .timeline {
        display: flex;
        align-items: center;
        gap: 0.5em;
        height: 36px;
        overflow: hidden;

        #scrub {
          width: 100%;
        }
      }

      #big-play-btn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      observable-plot-wrapper:not(:defined) {
        width: 100%;
        height: 50%;
        display: block;
        text-align: center;
        overflow: clip;
      }

      ::view-transition-group(plot-example) {
        overflow: clip;
        animation-duration: var(--duration);
        animation-timing-function: ease-in-out;
      }

      ::view-transition-old(plot-example) {
        width: 100%;
        object-fit: none;
        object-position: top left;
        z-index: 1;
      }

      ::view-transition-new(plot-example) {
        height: 100%;
        overflow: clip;

        object-fit: none;
        object-position: top left;
        z-index: 0;
      }
    </style>

    <div class="">

        <observable-plot-wrapper view-transition-name="plot-example" loading="manual">

        <nord-button square id="big-play-btn" type="button" variant="primary" size="l">
